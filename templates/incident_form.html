{% extends "base.html" %}
{% block title %}Report Incident{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Report Incident</h1>
</div>

<div class="panel form-panel">
    <form method="POST">
        <label for="student_id">Student</label>
        <select id="student_id" name="student_id" required>
            <option value="">Select student</option>
            {% for student in students %}
            <option value="{{ student.id }}">{{ student.student_number }} — {{ student.first_name }} {{ student.last_name }}</option>
            {% endfor %}
        </select>

        <label for="examination_id">Examination</label>
        <select id="examination_id" name="examination_id" required>
            <option value="">Select examination</option>
            {% for exam in examinations %}
            <option value="{{ exam.id }}">{{ exam.course_code }} — {{ exam.examination_date }}</option>
            {% endfor %}
        </select>

        <label for="incident_type">Incident Type</label>
        <input type="text" id="incident_type" name="incident_type" placeholder="e.g. Unauthorized material, Phone use, Talking" required>

        <label for="severity">Severity</label>
        <select id="severity" name="severity" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Describe what happened..."></textarea>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Report</button>
            <a href="{{ url_for('admin_dashboard') if session.get('role') == 'admin' else url_for('invigilator_dashboard') }}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
